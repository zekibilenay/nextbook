name: Surumleri derle (Windows, macOS, Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            asset: NextBook-windows.zip
            sep: ";"
            icon: "--icon next_book.ico"
          - label: macOS (Apple Silicon)
            os: macos-latest
            asset: NextBook-macos-arm64.zip
            sep: ":"
            icon: "--icon next_book.icns"
          - label: macOS (Intel)
            os: macos-15-intel
            asset: NextBook-macos-intel.zip
            sep: ":"
            icon: "--icon next_book.icns"
          - label: Linux
            os: ubuntu-22.04
            asset: NextBook-linux.tar.gz
            sep: ":"
            icon: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tkinter kur (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Etiket ile APP_VERSION ayni mi?
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME.TrimStart('v')
          $m = Select-String -Path next_book.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($tag -ne $ver) {
            Write-Error "Etiket ($tag) ile APP_VERSION ($ver) uyusmuyor. Once next_book.py icindeki surumu guncelle."
            exit 1
          }

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Derle
        shell: bash
        run: pyinstaller --onedir --windowed --name NextBook ${{ matrix.icon }} --add-data "next_book.ico${{ matrix.sep }}." --hidden-import openpyxl next_book.py

      - name: Paketle (Windows - zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/NextBook -DestinationPath "${{ matrix.asset }}"

      - name: Paketle (macOS - .app zip)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/NextBook.app "${{ matrix.asset }}"

      - name: Paketle (Linux - tar.gz, calistirma izinleri korunur)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist NextBook

      - name: SHA256 olustur (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.asset }}" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: SHA256 olustur (macOS / Linux)
        if: runner.os != 'Windows'
        run: shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Uretim kaydi ekle
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    name: Release'e ekle
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Release'e ekle
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
